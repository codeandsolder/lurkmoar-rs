[package]
name = "lurkmoar"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Tiny change-driven Prometheus metrics push client with bounded outage spooling"
repository = "https://github.com/codeandsolder/lurkmoar-rs"

[dependencies]
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "a8385c80ba6a5b035067d3a2e472d37df591faf0", default-features = false, features = ["tokio-rt", "webpki-roots", "native-roots", "system-proxy"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = "warn"
unfulfilled_lint_expectations = "deny"
unused_results = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

[patch.crates-io]
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast.git", rev = "98f76b3a242099f2229b048360eeb4707246a68f" }
